name: CI/CD Pipeline

"on":
  push:
    branches:
      - dev
    paths:
      - "artist_service/**"
      - "event_service/**"
      - "payment_service/**"
      - "booking_service/**"
      - "user_service/**"
      - "venue_service/**"
      - "inventory_service/**"
      - "admin_frontend/**"
      - "client_frontend/**"
      - "k8s/**"
      - "docker-compose.yml"
      - ".github/workflows/dockerhub-images.yml"
  workflow_dispatch:

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      artist: ${{ steps.filter.outputs.artist }}
      event: ${{ steps.filter.outputs.event }}
      payment: ${{ steps.filter.outputs.payment }}
      booking: ${{ steps.filter.outputs.booking }}
      user: ${{ steps.filter.outputs.user }}
      venue: ${{ steps.filter.outputs.venue }}
      inventory: ${{ steps.filter.outputs.inventory }}
      admin_frontend: ${{ steps.filter.outputs.admin_frontend }}
      client_frontend: ${{ steps.filter.outputs.client_frontend }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes by service
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            artist:
              - "artist_service/**"
            event:
              - "event_service/**"
            payment:
              - "payment_service/**"
            booking:
              - "booking_service/**"
            user:
              - "user_service/**"
            venue:
              - "venue_service/**"
            inventory:
              - "inventory_service/**"
            admin_frontend:
              - "admin_frontend/**"
            client_frontend:
              - "client_frontend/**"
            k8s:
              - "k8s/**"

  build-artist:
    name: Build and Push Artist Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.artist == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push artist image
        uses: docker/build-push-action@v6
        with:
          context: ./artist_service
          file: ./artist_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/artist_service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/artist_service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-event:
    name: Build and Push Event Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.event == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push event image
        uses: docker/build-push-action@v6
        with:
          context: ./event_service
          file: ./event_service/Dockerfile
          push: true
          secrets: |
            aws_region=${{ secrets.AWS_REGION }}
            ssm_state_machine_arn_param=${{ secrets.SSM_STATE_MACHINE_ARN_PARAM }}
            aws_access_key_id=${{ secrets.AWS_ACCESS_KEY_ID }}
            aws_secret_access_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/event_service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/event_service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-payment:
    name: Build and Push Payment Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.payment == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push payment image
        uses: docker/build-push-action@v6
        with:
          context: ./payment_service
          file: ./payment_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/payment_service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/payment_service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-booking:
    name: Build and Push Booking Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.booking == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push booking image
        uses: docker/build-push-action@v6
        with:
          context: ./booking_service
          file: ./booking_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/booking_service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/booking_service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-user:
    name: Build and Push User Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.user == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push user image
        uses: docker/build-push-action@v6
        with:
          context: ./user_service
          file: ./user_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/user_service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/user_service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-venue:
    name: Build and Push Venue Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.venue == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push venue image
        uses: docker/build-push-action@v6
        with:
          context: ./venue_service
          file: ./venue_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/venue_service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/venue_service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-inventory:
    name: Build and Push Inventory Service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.inventory == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push inventory image
        uses: docker/build-push-action@v6
        with:
          context: ./inventory_service
          file: ./inventory_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/inventory_service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/inventory_service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-admin-frontend:
    name: Build and Push Admin Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.admin_frontend == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push admin frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./admin_frontend
          file: ./admin_frontend/Dockerfile
          push: true
          no-cache: true
          build-args: |
            NEXT_PUBLIC_EVENT_SERVICE_URL=${{ secrets.NEXT_PUBLIC_EVENT_SERVICE_URL }}
            NEXT_PUBLIC_USER_SERVICE_URL=${{ secrets.NEXT_PUBLIC_USER_SERVICE_URL }}
            NEXT_PUBLIC_BOOKING_SERVICE_URL=${{ secrets.NEXT_PUBLIC_BOOKING_SERVICE_URL }}
            NEXT_PUBLIC_ARTIST_SERVICE_URL=${{ secrets.NEXT_PUBLIC_ARTIST_SERVICE_URL }}
            NEXT_PUBLIC_VENUE_SERVICE_URL=${{ secrets.NEXT_PUBLIC_VENUE_SERVICE_URL }}
            NEXT_PUBLIC_PAYMENT_SERVICE_URL=${{ secrets.NEXT_PUBLIC_PAYMENT_SERVICE_URL }}
            NEXT_PUBLIC_INVENTORY_SERVICE_URL=${{ secrets.NEXT_PUBLIC_INVENTORY_SERVICE_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/admin_frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/admin_frontend:${{ github.sha }}

  build-client-frontend:
    name: Build and Push Client Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.client_frontend == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push client frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client_frontend
          file: ./client_frontend/Dockerfile
          push: true
          no-cache: true
          build-args: |
            NEXT_PUBLIC_EVENT_SERVICE_URL=${{ secrets.NEXT_PUBLIC_EVENT_SERVICE_URL }}
            NEXT_PUBLIC_USER_SERVICE_URL=${{ secrets.NEXT_PUBLIC_USER_SERVICE_URL }}
            NEXT_PUBLIC_BOOKING_SERVICE_URL=${{ secrets.NEXT_PUBLIC_BOOKING_SERVICE_URL }}
            NEXT_PUBLIC_ARTIST_SERVICE_URL=${{ secrets.NEXT_PUBLIC_ARTIST_SERVICE_URL }}
            NEXT_PUBLIC_VENUE_SERVICE_URL=${{ secrets.NEXT_PUBLIC_VENUE_SERVICE_URL }}
            NEXT_PUBLIC_PAYMENT_SERVICE_URL=${{ secrets.NEXT_PUBLIC_PAYMENT_SERVICE_URL }}
            NEXT_PUBLIC_INVENTORY_SERVICE_URL=${{ secrets.NEXT_PUBLIC_INVENTORY_SERVICE_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/client_frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/client_frontend:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-artist
      - build-event
      - build-payment
      - build-booking
      - build-user
      - build-venue
      - build-inventory
      - build-admin-frontend
      - build-client-frontend
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.K8S_MASTER_SSH_KEY }}" > ~/.ssh/k8s-key.pem
          chmod 600 ~/.ssh/k8s-key.pem
          ssh-keyscan -H ${{ secrets.K8S_MASTER_HOST }} >> ~/.ssh/known_hosts

      # - name: Install git and sync k8s manifests
      #   run: |
      #     ssh -i ~/.ssh/k8s-key.pem ${{ secrets.K8S_MASTER_USER }}@${{ secrets.K8S_MASTER_HOST }} << 'EOF'
      #       if ! command -v git &> /dev/null; then
      #         sudo apt-get update
      #         sudo apt-get install -y git
      #       fi


      #       if [ ! -d "$HOME/k8s-manifests" ]; then
      #         git clone --depth=1 --filter=blob:none --sparse \
      #           --branch ${{ github.ref_name }} \
      #           https://github.com/Chamodpw2000/event_ticket_booking_application.git \
      #           $HOME/k8s-manifests
      #         cd $HOME/k8s-manifests
      #         git sparse-checkout set k8s
      #       else
      #         cd $HOME/k8s-manifests
      #         git pull origin ${{ github.ref_name }}
      #       fi
      #     EOF

      - name: Install git and sync k8s manifests
        run: |
          ssh -i ~/.ssh/k8s-key.pem ${{ secrets.K8S_MASTER_USER }}@${{ secrets.K8S_MASTER_HOST }} << 'EOF'
            if ! command -v git &> /dev/null; then
              sudo apt-get update
              sudo apt-get install -y git
            fi

            # Remove old folder if exists to avoid conflicts
            rm -rf $HOME/k8s-manifests

            git clone --depth=1 --filter=blob:none --sparse \
              --branch ${{ github.ref_name }} \
              https://github.com/Chamodpw2000/event_ticket_booking_application.git \
              $HOME/k8s-manifests
            cd $HOME/k8s-manifests
            git sparse-checkout set k8s
          EOF

      - name: Apply K8s manifests
        run: |
          ssh -i ~/.ssh/k8s-key.pem ${{ secrets.K8S_MASTER_USER }}@${{ secrets.K8S_MASTER_HOST }} << 'EOF'
            cd $HOME/k8s-manifests/k8s

            kubectl apply -f app-config.yaml
            kubectl apply -f mongodb-databases.yaml
            kubectl apply -f mysql-databases.yaml
            kubectl apply -f services.yaml
            kubectl apply -f frontend-config.yaml
            kubectl apply -f frontends.yaml
            kubectl apply -f nodeport-services.yaml
            kubectl apply -f ingress.yaml
          EOF

      - name: Restart changed deployments
        run: |
          ssh -i ~/.ssh/k8s-key.pem ${{ secrets.K8S_MASTER_USER }}@${{ secrets.K8S_MASTER_HOST }} << 'EOF'
            if [ "${{ needs.detect-changes.outputs.artist }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout restart deployment artist-service
            fi
            if [ "${{ needs.detect-changes.outputs.event }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout restart deployment event-service
            fi
            if [ "${{ needs.detect-changes.outputs.payment }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout restart deployment payment-service
            fi
            if [ "${{ needs.detect-changes.outputs.booking }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout restart deployment booking-service
            fi
            if [ "${{ needs.detect-changes.outputs.user }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout restart deployment user-service
            fi
            if [ "${{ needs.detect-changes.outputs.venue }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout restart deployment venue-service
            fi
            if [ "${{ needs.detect-changes.outputs.inventory }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout restart deployment inventory-service
            fi
            if [ "${{ needs.detect-changes.outputs.admin_frontend }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout restart deployment admin-frontend
            fi
            if [ "${{ needs.detect-changes.outputs.client_frontend }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout restart deployment client-frontend
            fi
          EOF

      - name: Wait for rollouts to complete
        run: |
          ssh -i ~/.ssh/k8s-key.pem ${{ secrets.K8S_MASTER_USER }}@${{ secrets.K8S_MASTER_HOST }} << 'EOF'
            if [ "${{ needs.detect-changes.outputs.artist }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout status deployment/artist-service --timeout=120s
            fi
            if [ "${{ needs.detect-changes.outputs.event }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout status deployment/event-service --timeout=120s
            fi
            if [ "${{ needs.detect-changes.outputs.payment }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout status deployment/payment-service --timeout=120s
            fi
            if [ "${{ needs.detect-changes.outputs.booking }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout status deployment/booking-service --timeout=120s
            fi
            if [ "${{ needs.detect-changes.outputs.user }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout status deployment/user-service --timeout=120s
            fi
            if [ "${{ needs.detect-changes.outputs.venue }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout status deployment/venue-service --timeout=120s
            fi
            if [ "${{ needs.detect-changes.outputs.inventory }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout status deployment/inventory-service --timeout=120s
            fi
            if [ "${{ needs.detect-changes.outputs.admin_frontend }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout status deployment/admin-frontend --timeout=120s
            fi
            if [ "${{ needs.detect-changes.outputs.client_frontend }}" == "true" ] || [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              kubectl rollout status deployment/client-frontend --timeout=120s
            fi
          EOF

      - name: Health check services
        run: |
          ssh -i ~/.ssh/k8s-key.pem ${{ secrets.K8S_MASTER_USER }}@${{ secrets.K8S_MASTER_HOST }} << 'EOF'
            echo "=== Checking service health ==="
            services=(
              "artist-service:30004"
              "event-service:30001"
              "user-service:30002"
              "venue-service:30005"
              "payment-service:30006"
              "booking-service:30003"
              "inventory-service:30007"
            )
            for service in "${services[@]}"; do
              name=$(echo $service | cut -d: -f1)
              port=$(echo $service | cut -d: -f2)
              status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$port/health)
              if [ "$status" == "200" ]; then
                echo "✅ $name is healthy (HTTP $status)"
              else
                echo "❌ $name is unhealthy (HTTP $status)"
                exit 1
              fi
            done
          EOF

      - name: Deployment summary
        if: always()
        run: |
          ssh -i ~/.ssh/k8s-key.pem ${{ secrets.K8S_MASTER_USER }}@${{ secrets.K8S_MASTER_HOST }} << 'EOF'
            echo "========================================="
            echo "         DEPLOYMENT SUMMARY"
            echo "========================================="
            echo ""
            echo "=== Pod Status ==="
            kubectl get pods -o wide
            echo ""
            echo "=== Ingress ==="
            kubectl get ingress
            echo ""
            echo "=== Recent Warnings ==="
            kubectl get events --sort-by='.lastTimestamp' | grep -i "error\|warning\|failed" | tail -10
          EOF