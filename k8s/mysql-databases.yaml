# ── mysql-event ───────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-event-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/mysql-event-data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker-1

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-event-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  volumeName: mysql-event-pv

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-event
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-event
  template:
    metadata:
      labels:
        app: mysql-event
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker-1
      containers:
        - name: mysql-event
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: event_platform_event_db
          volumeMounts:
            - name: mysql-event-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-event-storage
          persistentVolumeClaim:
            claimName: mysql-event-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mysql-event-service
spec:
  selector:
    app: mysql-event
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP

