apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "MyNewPass123!"

---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  DATABASE_URL_ARTIST:    "mongodb://mongodb-artist-service:27017/event_platform_artist_db"
  DATABASE_URL_USER:      "mongodb://mongodb-user-service:27017/event_platform_user_db"
  DATABASE_URL_VENUE:     "mongodb://mongodb-venue-service:27017/event_platform_venue_db"
  DATABASE_URL_EVENT:     "mysql://root:MyNewPass123%21@mysql-event-service:3306/event_platform_event_db"
  DATABASE_URL_PAYMENT:   "mysql://root:MyNewPass123%21@mysql-payment-service:3306/event_platform_payment_db"
  DATABASE_URL_BOOKING:   "mysql://root:MyNewPass123%21@mysql-booking-service:3306/event_platform_booking_db"
  DATABASE_URL_INVENTORY: "mysql://root:MyNewPass123%21@mysql-inventory-service:3306/event_platform_inventory_db"
  JWT_SECRET:             "replace-with-a-strong-secret"
