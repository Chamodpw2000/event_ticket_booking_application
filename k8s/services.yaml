apiVersion: apps/v1
kind: Deployment
metadata:
  name: artist-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artist-service
  template:
    metadata:
      labels:
        app: artist-service
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: mongo:7
          command: ['sh', '-c', 'until mongosh --host mongodb-artist-service --eval "db.adminCommand({ping:1})" --quiet; do echo waiting for mongodb-artist; sleep 3; done']
      containers:
        - name: artist-service
          image: tiransarith/artist_service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3004
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL_ARTIST
            - name: JSON_BODY_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: JSON_BODY_LIMIT
            - name: S3_ARTIST_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: S3_ARTIST_BUCKET_NAME
            - name: PROFILE_IMAGE_MAX_BYTES
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PROFILE_IMAGE_MAX_BYTES
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_REGION

---
apiVersion: v1
kind: Service
metadata:
  name: artist-service
spec:
  selector:
    app: artist-service
  ports:
    - port: 3004
      targetPort: 3004
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - event-service
                topologyKey: kubernetes.io/hostname
      initContainers:
        - name: wait-for-mysql
          image: mysql:8.0
          command: ['sh', '-c', 'until mysqladmin ping -h mysql-event-service -u root -pMyNewPass123! --silent; do echo waiting for mysql-event; sleep 3; done']
      containers:
        - name: event-service
          image: tiransarith/event_service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL_EVENT
            - name: STATE_MACHINE_ARN_TICKET
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: STATE_MACHINE_ARN_TICKET
            - name: S3_EVENT_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: S3_EVENT_BUCKET_NAME
            - name: BANNER_IMAGE_MAX_BYTES
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: BANNER_IMAGE_MAX_BYTES
            - name: JSON_BODY_LIMIT
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: JSON_BODY_LIMIT
            - name: VENUE_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: VENUE_SERVICE_URL
            - name: ARTIST_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: ARTIST_SERVICE_URL
            - name: INVENTORY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: INVENTORY_SERVICE_URL
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: AWS_REGION

---
apiVersion: v1
kind: Service
metadata:
  name: event-service
spec:
  selector:
    app: event-service
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP

