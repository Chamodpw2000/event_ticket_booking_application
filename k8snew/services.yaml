# ── artist-service (MongoDB) ─────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artist-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artist-service
  template:
    metadata:
      labels:
        app: artist-service
    spec:
      initContainers:
        - name: wait-for-mongodb
          image: mongo:7
          command: ['sh', '-c', 'until mongosh --host mongodb-service --eval "db.adminCommand({ping:1})" --quiet; do echo waiting for mongodb; sleep 3; done']
      containers:
        - name: artist-service
          image: tiransarith/artist_service:v1
          ports:
            - containerPort: 3004
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_URL_ARTIST

---
apiVersion: v1
kind: Service
metadata:
  name: artist-service
spec:
  selector:
    app: artist-service
  ports:
    - port: 3004
      targetPort: 3004
  type: ClusterIP

