# ── API ingress ───────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/artists/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: artist-service
                port:
                  number: 3004
          - path: /api/events/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: event-service
                port:
                  number: 3001
          - path: /api/payments/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: payment-service
                port:
                  number: 3006
          - path: /api/bookings/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: booking-service
                port:
                  number: 3003
          - path: /api/inventory/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: inventory-service
                port:
                  number: 3007
          - path: /api/users/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-service
                port:
                  number: 3002
          - path: /api/venues/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: venue-service
                port:
                  number: 3005

---
# ── Admin frontend ingress (no rewrite) ──────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-frontend-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: admin-frontend
                port:
                  number: 3000

---
# ── Client frontend ingress (no rewrite) ─────────────
---
# ── Client frontend ingress (no rewrite) ─────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: client-frontend-ingress
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client-frontend
                port:
                  number: 3000
