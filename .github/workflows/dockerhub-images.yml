            NEXT_PUBLIC_BOOKING_SERVICE_URL=${{ secrets.NEXT_PUBLIC_BOOKING_SERVICE_URL }}
            NEXT_PUBLIC_ARTIST_SERVICE_URL=${{ secrets.NEXT_PUBLIC_ARTIST_SERVICE_URL }}
            NEXT_PUBLIC_VENUE_SERVICE_URL=${{ secrets.NEXT_PUBLIC_VENUE_SERVICE_URL }}
