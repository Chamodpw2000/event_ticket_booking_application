apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets-external
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: event-ticket/database-urls
    - extract:
        key: event-ticket/app-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mysql-secret-external
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    kind: SecretStore
  target:
    name: mysql-secret
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: event-ticket/app-secrets
        property: MYSQL_ROOT_PASSWORD
