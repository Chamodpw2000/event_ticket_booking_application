name: Terraform Infrastructure

"on":
  push:
    branches:
      - dev
      - tiran3
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to perform'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.TF_AWS_REGION }}

      - name: Terraform Init
        run: |
          cd terraform
          terraform init

      - name: Terraform Validate
        run: |
          cd terraform
          terraform validate

      - name: Import existing resources
        run: |
          cd terraform

          # VPC
          terraform import aws_vpc.main vpc-05c5731d9ebd44d28 || true

          # Subnet
          terraform import aws_subnet.main subnet-03670014041b3ff5 || true

          # Internet Gateway
          terraform import aws_internet_gateway.main $(aws ec2 describe-internet-gateways \
            --filters "Name=attachment.vpc-id,Values=vpc-05c5731d9ebd44d28" \
            --query "InternetGateways[0].InternetGatewayId" \
            --output text) || true

          # Route Table
          RTB_ID=$(aws ec2 describe-route-tables \
            --filters "Name=vpc-id,Values=vpc-05c5731d9ebd44d28" \
            --query "RouteTables[?Associations[?SubnetId=='subnet-03670014041b3ff5']].RouteTableId" \
            --output text)
          echo "Route Table ID: $RTB_ID"
          if [ "$RTB_ID" != "None" ] && [ -n "$RTB_ID" ]; then
            terraform import aws_route_table.main $RTB_ID || true

            # Route Table Association
            ASSOC_ID=$(aws ec2 describe-route-tables \
              --route-table-ids $RTB_ID \
              --query "RouteTables[0].Associations[?SubnetId=='subnet-03670014041b3ff5'].RouteTableAssociationId" \
              --output text)
            echo "Association ID: $ASSOC_ID"
            if [ -n "$ASSOC_ID" ] && [ "$ASSOC_ID" != "None" ]; then
              terraform import aws_route_table_association.main $ASSOC_ID || true
            fi
          fi

          # Security Group
          terraform import aws_security_group.k8s sg-09b531e629b36564d || true

          # EC2 Instances
          terraform import aws_instance.k8s_master i-09290d124edc7c1eb || true
          terraform import aws_instance.k8s_worker_1 i-0c25601ad1152bc47 || true
          terraform import aws_instance.k8s_worker_2 i-0a3ad00c20ecd5e27 || true

          # Elastic IPs
          terraform import aws_eip.k8s_master eipalloc-0a2749747ead779ad || true
          terraform import aws_eip.k8s_worker_1 eipalloc-0ea6539cef039b211 || true
          terraform import aws_eip.k8s_worker_2 eipalloc-042d40cfa87a00ccb || true

      - name: Terraform Plan
        run: |
          cd terraform
          terraform plan -no-color -out=tfplan

      - name: Show Plan Summary
        run: |
          cd terraform
          echo "========================================="
          echo "         TERRAFORM PLAN SUMMARY"
          echo "========================================="
          terraform show -no-color tfplan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: |
          cd terraform
          echo "========================================="
          echo "         APPLYING TERRAFORM CHANGES"
          echo "========================================="
          terraform apply -auto-approve tfplan